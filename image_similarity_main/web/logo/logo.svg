<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="智图寻宝">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角渐变底 -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#tile)"/>
  <rect x="4" y="4" width="88" height="88" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- 放大镜手柄 -->
  <line x1="57" y1="57" x2="74" y2="74" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round"/>

  <!-- 放大镜镜片 -->
  <circle cx="40" cy="40" r="21.5" fill="url(#lens)" stroke="#ffffff" stroke-width="4.5"/>

  <!-- 镜片内的小图片：相框 + 山 + 太阳 -->
  <rect x="30" y="29" width="20" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M30 45.5 L37.5 38 L41.5 42 L45.5 37 L50 43.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="36" cy="34" r="2.2" fill="#ffffff"/>

  <!-- 右上角星光（AI / 寻宝的寓意） -->
  <path d="M78 18 l1.9 4.6 4.6 1.9 -4.6 1.9 -1.9 4.6 -1.9 -4.6 -4.6 -1.9 4.6 -1.9 z" fill="#ffffff" filter="url(#soft)"/>

  <!-- 左上角小光点 -->
  <circle cx="21" cy="21" r="2.2" fill="#ffffff" fill-opacity="0.9"/>
</svg>
